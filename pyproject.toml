[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdlproject"
version = "0.2.0"
description = "A modular system for managing Vivado FPGA projects"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "InquirerPy>=0.3.4",
    "prompt-toolkit>=3.0.0",
    "psutil>=5.9.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
    "GitPython>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "hdldepends>=0.1.3",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
hdlproject = "hdlproject.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hdlproject*"]

[tool.setuptools.package-data]
hdlproject = [
    "tcl/*.tcl",
    "tcl/vivado/static/*.tcl",
    "tcl/vivado/templates/*.j2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "test"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["test/unit"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
files = ["src/hdlproject"]
ignore_missing_imports = true
# Advisory only for now: do not fail the build on type errors.
warn_unused_ignores = false
check_untyped_defs = false